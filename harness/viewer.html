<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PolyBridge game log viewer</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --mut: #6e6e73; --line: #d2d2d7; --card: #f5f5f7; --ok: #1f7a3a; --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f2f2f4; --mut: #98989f; --line: #3a3a3e; --card: #222225; --ok: #5fd08a; --err: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  input[type=range] { flex: 1 1 260px; }
  button { font: inherit; padding: 2px 10px; }
  #drop { padding: 40px; text-align: center; color: var(--mut); border: 2px dashed var(--line); margin: 40px; border-radius: 12px; }
  #app { display: none; grid-template-columns: minmax(300px, 1fr) minmax(280px, 380px); gap: 14px; padding: 14px; }
  .card { background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); margin: 0 0 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--mut); font-size: 12px; }
  svg text { font: 11px system-ui, sans-serif; pointer-events: none; }
  ul { margin: 0; padding-left: 18px; max-height: 240px; overflow: auto; }
  li.bad { color: var(--err); }
  pre { white-space: pre-wrap; margin: 0; font: 12px/1.45 ui-monospace, Consolas, monospace; max-height: 220px; overflow: auto; }
  .note { flex-basis: 100%; font-size: 12px; color: var(--mut); }
  .legend span { display: inline-block; margin-right: 10px; font-size: 12px; color: var(--mut); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>PolyBridge log</h1>
  <input type="file" id="file" accept=".jsonl,.txt,application/json">
  <button id="prev" title="Left arrow">&larr;</button>
  <input type="range" id="slider" min="0" max="0" value="0">
  <button id="next" title="Right arrow">&rarr;</button>
  <span id="turnLabel"></span>
</header>
<div id="drop">Choose a game log (.jsonl from harness/logs), or drop it here.</div>
<div id="app">
  <div>
    <div class="card"><h2>Map</h2><div id="map"></div>
      <div class="legend" id="legend"></div></div>
    <div class="card"><h2>Model</h2><pre id="model">(no model records in this log)</pre></div>
  </div>
  <div>
    <div class="card"><h2>Turn</h2><div class="stats" id="stats"></div></div>
    <div class="card"><h2>Opponents</h2><div id="opps"></div></div>
    <div class="card"><h2>Actions this turn</h2><ul id="actions"></ul></div>
    <div class="card"><h2>Errors this turn</h2><ul id="errors"></ul></div>
    <div class="card"><h2>Game totals</h2><div id="totals"></div></div>
  </div>
</div>
<script>
const TERRAIN = { Field: "#a7d37a", Forest: "#3f7d3a", Mountain: "#8d8d8f", Hills: "#b5a06a", Water: "#4f94c9", Ocean: "#1d4f7c", Desert: "#e3cd8a", Snow: "#eef3f8", Swamp: "#6b7e4b" };
const UNKNOWN = "#2a2a2e";
const OWNER = { 1: "#f5c518", 2: "#e5484d" };
const TOKEN_KEYS = ["prompt_tokens", "output_tokens", "cache_read_tokens"];

let turns = [];      // [{turn, state, actions, models, errors}]
let gameEnd = null;  // /result answer, if the game finished
let totals = {};     // token totals over the whole game

const $ = id => document.getElementById(id);
const svgNS = "http://www.w3.org/2000/svg";

function el(tag, props = {}, text) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  if (text !== undefined) node.textContent = text;
  return node;
}
function svg(tag, attrs = {}) {
  const node = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}
function fmtXY(p) { return p ? `[${p[0]},${p[1]}]` : ""; }

function loadLog(text) {
  turns = []; gameEnd = null; totals = Object.fromEntries(TOKEN_KEYS.map(k => [k, 0]));
  let modelCount = 0;
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    const r = JSON.parse(line);
    if (r.t === "turn_start") { turns.push({ turn: r.turn, state: r.state, actions: [], models: [], errors: [] }); continue; }
    if (r.t === "game_end") { gameEnd = r.result; continue; }
    const owner = findTurn(r.turn);
    if (!owner) continue;
    if (r.t === "action") owner.actions.push(r);
    else if (r.t === "error") owner.errors.push(r);
    else if (r.t === "model") { owner.models.push(r); modelCount++; for (const k of TOKEN_KEYS) totals[k] += r[k] || 0; }
  }
  totals.modelRecords = modelCount;
  if (!turns.length) { alert("No turn_start records in this file."); return; }
  $("drop").style.display = "none";
  $("app").style.display = "grid";
  $("slider").max = turns.length - 1;
  show(0);
}

function findTurn(n) {
  for (let i = turns.length - 1; i >= 0; i--) if (turns[i].turn === n) return turns[i];
  return null;
}

function show(i) {
  i = Math.max(0, Math.min(turns.length - 1, i));
  const t = turns[i];
  $("slider").value = i;
  $("turnLabel").textContent = `turn ${t.turn} (${i + 1}/${turns.length})`;
  renderStats(t);
  renderMap(t.state);
  renderOpps(t.state);
  renderActions(t);
  renderModel(t);
  renderTotals();
}

function renderStats(t) {
  const s = t.state, me = s.me || {};
  const tok = Object.fromEntries(TOKEN_KEYS.map(k => [k, t.models.reduce((a, m) => a + (m[k] || 0), 0)]));
  const box = (value, label) => {
    const d = el("div", { className: "stat" });
    d.append(el("b", {}, String(value ?? "-")), el("span", {}, label));
    return d;
  };
  $("stats").replaceChildren(
    box(me.score, "score"), box(me.stars, "stars"), box(me.income, "income"),
    box((s.units || []).filter(u => u.own === 1).length, "your units"),
    box((s.cities || []).filter(c => c.own === 1).length, "your cities"),
    box(t.actions.length, "actions"), box(t.errors.length, "errors"),
    el("div", { className: "note" }, "techs: " + ((me.techs || []).join(", ") || "none")),
    el("div", { className: "note" }, `tokens this turn: prompt ${tok.prompt_tokens}, output ${tok.output_tokens}, cache read ${tok.cache_read_tokens}`),
  );
}

function renderMap(s) {
  const map = s.map || { w: 0, h: 0, tiles: [] };
  const size = Math.max(14, Math.floor(Math.min(560 / Math.max(map.w, 1), 560 / Math.max(map.h, 1))));
  const tiles = new Map((map.tiles || []).map(t => [t.xy.join(","), t]));
  const cities = new Map((s.cities || []).map(c => [c.xy.join(","), c]));
  const villages = new Set((s.villages || []).map(v => v.join(",")));
  const units = new Map();
  for (const u of s.units || []) {
    const k = u.xy.join(",");
    units.set(k, [...(units.get(k) || []), u]);
  }
  const root = svg("svg", { width: map.w * size, height: map.h * size, viewBox: `0 0 ${map.w * size} ${map.h * size}` });
  for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) {
    const key = `${x},${y}`, t = tiles.get(key), px = x * size, py = y * size;
    const g = svg("g");
    const rect = svg("rect", { x: px, y: py, width: size, height: size, fill: t ? (TERRAIN[t.t] || "#999") : UNKNOWN,
      stroke: t && t.own ? (OWNER[t.own] || "#aaa") : "var(--line)", "stroke-width": t && t.own ? 2 : 0.5 });
    g.append(rect);
    const tip = svg("title");
    tip.textContent = t ? `${key} ${t.t}${t.own ? " own " + t.own : ""}${t.res ? " res " + t.res : ""}${t.imp ? " imp " + t.imp : ""}${t.road ? " road" : ""}${(t.eff || []).length ? " eff " + t.eff.join(",") : ""}` : `${key} unexplored`;
    g.append(tip);
    if (!t) g.append(svgText(px + size / 2, py + size / 2, "?", "middle", "var(--mut)"));
    if (villages.has(key)) g.append(svg("circle", { cx: px + size * 0.8, cy: py + size * 0.2, r: size * 0.12, fill: "#fff", stroke: "#333" }));
    const c = cities.get(key);
    if (c) {
      g.append(svg("rect", { x: px + size * 0.18, y: py + size * 0.18, width: size * 0.64, height: size * 0.64, rx: 3,
        fill: OWNER[c.own] || "#ddd", stroke: "#000", "stroke-width": 1 }));
      g.append(svgText(px + size / 2, py + size / 2 + 4, (c.name || "C")[0], "middle", "#000"));
    }
    (units.get(key) || []).forEach((u, n, all) => {
      const off = (all.length - 1 - n) * size * 0.18;
      const cx = px + size / 2 - off, cy = py + size * 0.5 + off * 0.4;
      g.append(svg("circle", { cx, cy, r: size * 0.28, fill: u.own === 1 ? "#0a84ff" : "#e5484d", stroke: "#fff", "stroke-width": 1.5 }));
      g.append(svgText(cx, cy + 3.5, (u.type || "?")[0], "middle", "#fff"));
      const ut = svg("title"); ut.textContent = `${u.type} #${u.id} own ${u.own} hp ${u.hp}/${u.hpMax}${u.moved ? " moved" : ""}`;
      g.append(ut);
    });
    root.append(g);
  }
  $("map").replaceChildren(root);
  renderLegend();
}

function renderLegend() {
  const items = [...Object.entries(TERRAIN), ["unexplored", UNKNOWN], ["your unit", "#0a84ff"], ["enemy unit", "#e5484d"]];
  $("legend").replaceChildren(...items.map(([name, col]) => {
    const sp = el("span");
    sp.append(el("i", { className: "sw", style: `background:${col}` }), name);
    return sp;
  }));
}

function svgText(x, y, s, anchor, fill) {
  const t = svg("text", { x, y, "text-anchor": anchor, fill });
  t.textContent = s;
  return t;
}

function renderOpps(s) {
  const opps = (s.opponents || []).map(o => {
    const res = gameEnd && (gameEnd.scores || []).find(sc => sc.id === o.id);
    const score = o.score ?? (res ? res.score : "hidden");
    return el("div", {}, `${o.tribe} (id ${o.id}): score ${score}`);
  });
  $("opps").replaceChildren(...(opps.length ? opps : [el("div", {}, "none met yet")]));
}

function describe(a) {
  const parts = [a.k];
  if (a.u != null) parts.push(`unit ${a.u}`);
  if (a.city) parts.push(`city ${fmtXY(a.city)}`);
  if (a.at) parts.push(`at ${fmtXY(a.at)}`);
  if (a.tech) parts.push(a.tech);
  if (a.unit) parts.push(a.unit);
  if (a.imp) parts.push(a.imp);
  if (a.cmd) parts.push(a.cmd);
  if (a.reward) parts.push(a.reward);
  if (a.to) parts.push(`to ${Array.isArray(a.to[0]) ? a.to.map(fmtXY).join(" ") : fmtXY(a.to)}`);
  if (a.cost != null) parts.push(`(${a.cost}*)`);
  return parts.join(" ");
}

function renderActions(t) {
  const items = t.actions.map(r => {
    const li = el("li", {}, "");
    const ev = (r.result && r.result.events) || [];
    li.textContent = describe(r.action) + (ev.length ? ` - ${ev.join("; ")}` : "");
    return li;
  });
  $("actions").replaceChildren(...(items.length ? items : [el("li", {}, "no actions (ended turn)")]));
  $("errors").replaceChildren(...(t.errors.length
    ? t.errors.map(e => el("li", { className: "bad" }, e.message))
    : [el("li", {}, "none")]));
}

function renderModel(t) {
  if (!t.models.length) { $("model").textContent = "(no model records for this turn)"; return; }
  $("model").textContent = t.models.map(m =>
    `${m.text || ""}\n[tokens: prompt ${m.prompt_tokens}, output ${m.output_tokens}, cache read ${m.cache_read_tokens}]`
  ).join("\n\n");
}

function renderTotals() {
  const lines = [`model records: ${totals.modelRecords}`,
    `prompt ${totals.prompt_tokens}, output ${totals.output_tokens}, cache read ${totals.cache_read_tokens}`];
  if (gameEnd) {
    lines.push(`game over at turn ${gameEnd.turn}, winner ${gameEnd.winner}`);
    for (const s of gameEnd.scores || []) lines.push(`${s.tribe} (id ${s.id}): ${s.score}`);
  } else lines.push("game not finished (no game_end record)");
  $("totals").replaceChildren(...lines.map(l => el("div", {}, l)));
}

$("file").addEventListener("change", async e => { const f = e.target.files[0]; if (f) loadLog(await f.text()); });
$("slider").addEventListener("input", e => show(+e.target.value));
$("prev").addEventListener("click", () => show(+$("slider").value - 1));
$("next").addEventListener("click", () => show(+$("slider").value + 1));
document.addEventListener("keydown", e => {
  if (!turns.length) return;
  if (e.key === "ArrowLeft") show(+$("slider").value - 1);
  if (e.key === "ArrowRight") show(+$("slider").value + 1);
});
const drop = $("drop");
drop.addEventListener("dragover", e => e.preventDefault());
drop.addEventListener("drop", async e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadLog(await f.text()); });
</script>
</body>
</html>
